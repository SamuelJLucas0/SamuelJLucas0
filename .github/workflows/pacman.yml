# Dibuja a Pac-Man comiéndose la gráfica de contribuciones y lo publica en la rama "output".
name: Pac-Man de contribuciones

on:
  schedule:
    - cron: "0 6 * * *"   # una vez al día
  workflow_dispatch:       # botón para correrlo a mano
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
